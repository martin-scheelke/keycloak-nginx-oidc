# Activated in docker-compose via SPRING_PROFILES_ACTIVE=docker.
# The browser, this container and Keycloak all agree on one issuer host so token `iss`
# validation succeeds everywhere. host.docker.internal resolves:
#   - inside this container  -> host gateway -> published NGINX :8080 -> Keycloak
#   - in the host's browser  -> Docker Desktop maps it to the host
spring:
  security:
    oauth2:
      client:
        provider:
          keycloak:
            issuer-uri: http://host.docker.internal:8080/realms/demo
      resourceserver:
        jwt:
          issuer-uri: http://host.docker.internal:8080/realms/demo

app:
  public-base-url: http://host.docker.internal:8080

springdoc:
  swagger-ui:
    oauth2-redirect-url: http://host.docker.internal:8080/swagger-ui/oauth2-redirect.html
