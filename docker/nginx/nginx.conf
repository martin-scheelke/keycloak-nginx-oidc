worker_processes auto;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream app        { server app:8080; }
    upstream keycloak   { server keycloak:8080; }

    # Common proxy headers so both the app (Spring forward-headers-strategy) and Keycloak
    # (KC_PROXY_HEADERS=xforwarded) reconstruct the external URL correctly.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    server {
        listen 8080;
        server_name _;

        location = /nginx-health { add_header Content-Type text/plain; return 200 "ok\n"; }

        # Keycloak-owned paths -> Keycloak
        location ~ ^/(realms|resources|admin|js|robots\.txt) {
            proxy_pass http://keycloak;
        }

        # Everything else -> the Spring Boot microservice
        location / {
            proxy_pass http://app;
        }
    }
}
